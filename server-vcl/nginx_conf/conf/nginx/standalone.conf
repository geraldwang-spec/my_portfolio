events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=basic:10m rate=10r/s;
    
    server {
        listen       8080;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    server {
        listen       8443 ssl;
        listen       [::]:8443 ssl;
        server_name  _;
        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
				ssl_session_timeout 10m;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self';" always;

        # --- 加入這兩行 ---
        port_in_redirect off;      # 核心對策：重定向時不要包含埠號
        absolute_redirect off;    # 核心對策：使用相對路徑進行重定向
        # ----------------

        location / {
            limit_req zone=basic burst=20 nodelay;
            root   /opt/app-root/src;
            index  index.html;
        }
        location /api/ {
          limit_req zone=basic burst=10 nodelay;
          # 關鍵：指向 ubi 容器的名字與它在容器內監聽的 port
          proxy_pass http://testpy:8080/; 
          
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
