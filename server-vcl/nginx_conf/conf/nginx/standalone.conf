events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # 先建立實體 IP 的映射。如果是 Cloudflare Tunnel 帶進來的，就用 CF 真實 IP，否則才用表面 IP。
    map $realip_remote_addr $user_real_ip {
        default $binary_remote_addr;
        ~^.+    $realip_remote_addr;
    }

    # limit_req_zone $binary_remote_addr zone=basic:10m rate=10r/s;
    limit_req_zone $user_real_ip zone=basic:10m rate=10r/s;
    
    server {
        listen       8080;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    server {
        listen       8443 ssl;
        listen       [::]:8443 ssl;
        server_name  _;
        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
				ssl_session_timeout 10m;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Content-Security-Policy "default-src 'self';" always;
        # add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com; font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; script-src 'self' https://cdnjs.cloudflare.com;" always;
        # add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com; font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; script-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://cdnjs.cloudflare.com;" always;
        # 🎯 最佳化資安防護（已放行：Google字體、FontAwesome、jQuery CDN、及核心特效所需的 'unsafe-inline'）
        # add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com; font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; script-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:;" always;

        # --- 加入這兩行 ---
        port_in_redirect off;      # 核心對策：重定向時不要包含埠號
        absolute_redirect off;    # 核心對策：使用相對路徑進行重定向
        # ----------------
        
        # 🎯 實用補強：放寬上傳檔案限制至 50MB（避免未來傳圖表或大檔案時噴 413 錯誤）
        client_max_body_size 50m;

        # 1. 載入 real_ip 模組（通常 Nginx 已內建）
        # 2. 設定信任來源
        # 如果你可以確定 cloudflared 容器的名字，甚至可以嘗試：
        set_real_ip_from  10.101.1.0/24;  # 覆蓋 Podman 預設的虛擬網段
        set_real_ip_from  vcl_tunnel;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive on;

        # location / {
        #     limit_req zone=basic burst=20 nodelay;
        #     root   /opt/app-root/src;
        #     index  index.html;
        # }
        # location /api/ {
        #   limit_req zone=basic burst=10 nodelay;
        #   # 關鍵：指向 ubi 容器的名字與它在容器內監聽的 port
        #   proxy_pass http://testpy:8080/; 
        #
        #   proxy_set_header Host $host;
        #   proxy_set_header X-Real-IP $remote_addr;
        #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }
        # 🎯 修正一：動態網頁路徑 ( location / ) 全部轉發給 Flask 渲染
        location / {
            limit_req zone=basic burst=20 nodelay;
            
            # 關鍵：將 testpy 改為你的 Compose 服務名稱 core_pj
            proxy_pass http://core_pj:5000; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;       
            proxy_set_header X-Forwarded-Proto $scheme;


            # 🎯 代理優化：關閉暫存以便 Flask 的大筆 JSON 資料能即時、無延遲地串流給前端
            proxy_buffering off;

            # 🎯 預留擴充：支援 WebSockets 連線（若未來功能需要即時進度條或通知）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # ⏳ 調整逾時時間，避免 Flask 運算太久導致 Nginx 噴 504 Gateway Timeout
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # 🎯 修正二：截擊 /static/ 請求，由 Nginx 直接處理靜態資源
        location /static/ {
            limit_req zone=basic burst=30 nodelay;
            alias /opt/app-root/src/static/; # 對應容器內 Nginx 讀取靜態檔的目錄
            expires 7d;                      # 讓瀏覽器快取 7 天，加快載入速度
        }

        location /gradio/ {
          limit_req zone=basic burst=30 nodelay;

          proxy_pass http://core_pj:7860;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          # ⚠️ 關鍵：Gradio 必須開啟 WebSocket 支援
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";

          # 🎯 允許自身頁面以 iframe 嵌入 Gradio
          proxy_hide_header X-Frame-Options;
          add_header X-Frame-Options "SAMEORIGIN" always;

          # ⏳ 避免影像處理、ROI 計算或 AI 推理時間較長時連線被 Nginx 中斷
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
        }
    }
}
