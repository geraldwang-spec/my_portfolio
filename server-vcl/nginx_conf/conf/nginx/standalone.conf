events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=basic:10m rate=10r/s;
    
    server {
        listen       8080;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    server {
        listen       8443 ssl;
        listen       [::]:8443 ssl;
        server_name  _;
        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
				ssl_session_timeout 10m;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self';" always;

        # --- 加入這兩行 ---
        port_in_redirect off;      # 核心對策：重定向時不要包含埠號
        absolute_redirect off;    # 核心對策：使用相對路徑進行重定向
        # ----------------

        # 1. 載入 real_ip 模組（通常 Nginx 已內建）
        # 2. 設定信任來源
        # set_real_ip_from  10.22.0.0/16;  # 覆蓋 Podman 預設的虛擬網段
        # 如果你可以確定 cloudflared 容器的名字，甚至可以嘗試：
        # set_real_ip_from  vcl-tunnel;

        # real_ip_header    X-Forwarded-For;
        # real_ip_recursive on;

        # location / {
        #     limit_req zone=basic burst=20 nodelay;
        #     root   /opt/app-root/src;
        #     index  index.html;
        # }
        # location /api/ {
        #   limit_req zone=basic burst=10 nodelay;
        #   # 關鍵：指向 ubi 容器的名字與它在容器內監聽的 port
        #   proxy_pass http://testpy:8080/; 
        #
        #   proxy_set_header Host $host;
        #   proxy_set_header X-Real-IP $remote_addr;
        #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }
        # 🎯 修正一：動態網頁路徑 ( location / ) 全部轉發給 Flask 渲染
        location / {
            limit_req zone=basic burst=20 nodelay;
            
            # 關鍵：將 testpy 改為你的 Compose 服務名稱 core_pj
            proxy_pass http://core_pj:8080; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🎯 修正二：截擊 /static/ 請求，由 Nginx 直接處理靜態資源
        location /static/ {
            limit_req zone=basic burst=20 nodelay;
            alias /opt/app-root/src/static/; # 對應容器內 Nginx 讀取靜態檔的目錄
            expires 7d;                      # 讓瀏覽器快取 7 天，加快載入速度
        }
    }
}
