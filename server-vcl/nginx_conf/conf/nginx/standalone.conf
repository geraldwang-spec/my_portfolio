events { worker_connections 1024; }

# 容器慣例：錯誤 log 輸出到 stderr，`podman logs vclnginx` 才看得到
error_log /dev/stderr warn;

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # 🎯 存取 log：同時記錄「真實使用者 IP」與「轉送者（tunnel）IP」，方便除錯
    #   remote      = real_ip 模組替換後的使用者 IP
    #   via         = 替換前的連線來源（cloudflared 容器）
    log_format realip '$remote_addr via=$realip_remote_addr [$time_local] '
                      '"$request" $status $body_bytes_sent rt=$request_time '
                      '"$http_user_agent"';
    access_log /dev/stdout realip;

    # 🎯 限流 key 修正：
    #   原本用 map 取 $realip_remote_addr，但它是「替換前」的地址（tunnel 容器 IP），
    #   導致所有使用者共用同一個額度。real_ip 模組執行完後，$binary_remote_addr
    #   已經是使用者的真實 IP，直接用它即可（binary 版 IPv4 只佔 4 bytes，省 zone 空間）。
    limit_req_zone $binary_remote_addr zone=basic:10m rate=10r/s;
    limit_req_status 429;   # 被限流回 429，跟後端掛掉的 502/503 區分開來

    # 🎯 WebSocket：只有請求帶 Upgrade 標頭時才送 "Connection: upgrade"，
    #   一般 HTTP 請求送 "close"，避免每個請求都被當成升級請求
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       8080;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    server {
        listen       8443 ssl;
        listen       [::]:8443 ssl;
        server_name  _;

        # 憑證不進 git：用 server-vcl/gen-selfsigned-cert.sh 在本機產生
        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_timeout  10m;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # TODO: 前端資源確定後啟用 CSP（以下為候選設定）
        # add_header Content-Security-Policy "default-src 'self';" always;
        # add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com; font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; script-src 'self' https://cdnjs.cloudflare.com;" always;
        # add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com; font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; script-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://cdnjs.cloudflare.com;" always;
        # 🎯 最佳化資安防護（已放行：Google字體、FontAwesome、jQuery CDN、及核心特效所需的 'unsafe-inline'）
        # add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com; font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; script-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:;" always;

        port_in_redirect off;      # 重定向時不要包含埠號
        absolute_redirect off;     # 使用相對路徑進行重定向

        # 放寬上傳檔案限制至 50MB（Cloudflare 免費方案上限為 100MB）
        client_max_body_size 50m;

        # 信任來源：只有從 tunnel 來的請求，才採信它帶的使用者 IP 標頭
        #   10.101.1.0/24 = compose 的 frontend 網路；127.0.0.1 = 用 pod 共用網路時
        set_real_ip_from 10.101.1.0/24;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        # recursive on：從右往左跳過受信任的 IP，取第一個不受信任的，
        # 使用者自己偽造的 X-Forwarded-For 會留在左邊，不會被採用
        real_ip_recursive on;

        # 動態網頁全部轉發給 Flask
        location / {
            limit_req zone=basic burst=20 nodelay;

            proxy_pass http://core_pj:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 🎯 不再全域關閉 buffering：開著時 nginx 會先把回應收下來再慢慢送給使用者，
            #   網路慢的使用者不會一直佔住後端 worker。
            #   需要即時串流的回應（SSE、LLM 逐字輸出、進度條），由 Flask 在該回應加上
            #   標頭 "X-Accel-Buffering: no"，nginx 就只對那個回應關閉 buffering。

            # 支援 WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 調整逾時時間，避免 Flask 運算太久導致 504 Gateway Timeout
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # 靜態資源由 Nginx 直接處理
        location /static/ {
            limit_req zone=basic burst=30 nodelay;
            alias /opt/app-root/src/static/;
            expires 7d;
        }

        location /gradio/ {
            limit_req zone=basic burst=100 nodelay;

            proxy_pass http://core_pj:7860;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Gradio 必須開啟 WebSocket 支援
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 允許自身頁面以 iframe 嵌入 Gradio
            proxy_hide_header X-Frame-Options;
            # 注意：location 內只要寫了任何 add_header，server 層的 add_header 就全部不繼承，
            # 所以安全標頭要在這裡重寫一次
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # 避免影像處理、ROI 計算或 AI 推理時間較長時連線被中斷
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
