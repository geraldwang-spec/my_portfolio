networks:
  frontend:
    driver: bridge
    ipam:
      config: [{subnet: 10.101.1.0/24, gateway: 10.101.1.1}]
  backend_redis:
    driver: bridge
    ipam:
      config: [{subnet: 10.66.0.0/24, gateway: 10.66.0.1}]

services:
  vclredis:
    image: registry.redhat.io/rhel9/redis-7:latest
    container_name: vclredis
    secrets:
      - {source: redis_password, type: env, target: REDIS_PASSWORD}
    # environment: 
    #   - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD not set in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis_data:/var/lib/redis/data:Z,U
    networks:
      backend_redis: {ipv4_address: 10.66.0.3}

  mariadb_db:
    image: registry.redhat.io/rhel9/mariadb-1011
    container_name: mariadb_db
    ports:
      - "127.0.0.1:3306:3306" 
    environment:
      - MYSQL_USER=${MYSQL_USER:? MYSQL_USER not set}
      - MYSQL_DATABASE=${MYSQL_DATABASE:? MYSQL_DATABASE not set}
    secrets:
      - {source: mysql_password,      type: env, target: MYSQL_PASSWORD}
      - {source: mysql_root_password, type: env, target: MYSQL_ROOT_PASSWORD}
    volumes:
      - ./sqldata/:/var/lib/mysql:Z,U
    networks:
      backend_redis: {ipv4_address: 10.66.0.4}

  core_pj:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/my-ubi-python:latest
    container_name: core_pj
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:? MYSQL_DATABASE not set}
      - MYSQL_USER=${MYSQL_USER:? MYSQL_USER not set}
      - REDIS_HOST=vclredis
      - MAIL_USERNAME=${MAIL_USERNAME:?MAIL_USERNAME not set}
    secrets:
      - secret_key
      - mysql_password
      - mysql_root_password
      - redis_password
      - mail_password
    depends_on:
      - mariadb_db
      - vclredis
    networks:
      - frontend
      - backend_redis
    userns: keep-id
    volumes:
      - ./coreVcl:/app:z #,U 最後到生產環境時還是需要加上
    command: tail -f /dev/null # ready for development

  vclnginx:
    image: registry.redhat.io/ubi8/nginx-122:latest
    container_name: vclnginx
    # 開發完之後需未來如果你把 core_pj 的 command 改回跑後端服務（如 Gunicorn），且需
    # 要 Nginx 精準等到後端「服務完全就緒（可連線狀態）」才開，那需要在 core_pj 裡加上
    # healthcheck 設定，並把 depends_on 改寫成 condition: service_healthy 模式。
    depends_on:
      - core_pj
    # 開啟可以在本地測試
    # ports:
    #   - "8080:8080"
    #   - "8443:8443"
    volumes:
      - ./server-vcl/nginx_conf/conf/nginx/standalone.conf:/etc/nginx/nginx.conf:Z
      - ./server-vcl/nginx_conf/conf/certs/:/etc/nginx/certs:Z,ro 
      # - ./coreVcl/templates/:/opt/app-root/src:Z,ro
      - ./coreVcl/static/:/opt/app-root/src/static:z,ro
    networks:
      - frontend
    command: nginx -g "daemon off;"
  vcl_tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: vcl_tunnel
    depends_on:
      - vclnginx
    networks: 
      - frontend
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --protocol
      - http2
      - --url 
      - https://vclnginx:8443
      - --no-tls-verify

secrets:
  secret_key:          {external: true}
  mysql_password:      {external: true}
  mysql_root_password: {external: true}
  redis_password:      {external: true}
  mail_password:       {external: true}
