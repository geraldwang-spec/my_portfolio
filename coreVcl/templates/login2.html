<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Roboto:400,100,300,500,700,900&font-display=swap">

  <!-- 2. 補上 Font Awesome 圖標庫 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
  <link href="/static/css/login2.css" rel="stylesheet">
</head>


<body>

  <div class="auth-card" data-view="login">

    <form class="panel panel--login">
      <h2>LOGIN</h2>
      <div class="field">
        <input type="text" id="login-username" name="login-username" required placeholder=" ">
        <label for="login-username">Username</label>
      </div>
      <div class="field">
        <input type="password" id="login-password" name="login-password" required placeholder=" ">
        <label for="login-password">Password</label>
      </div>
      <p class="error-message"></p>
      <button type="submit" class="btn btn--login">
        GO
      </button>
      <a href="#" class="pass-forget">Forgot your password</a>
    </form>

    <form class="panel panel--register">
      <h2>REGISTER</h2>
      <div class="field">
        <input type="text" id="register-username" name="register-username" required placeholder=" ">
        <label for="register-username">Username</label>
      </div>

      <div class="field">
        <input type="password" id="register-password" name="register-password" required placeholder=" ">
        <label for="register-password">Password</label>
      </div>
      <div class="field">
        <input type="password" id="register-repeat" name="register-repeat" required placeholder=" ">
        <label for="register-repeat">Repeat</label>
      </div>

      <div class="field">
        <input type="email" id="register-email" name="register-email" required placeholder=" ">
        <label for="register-email">E-mail</label>
      </div>

      <p class="error-message"></p>
      <button type="submit" class="btn btn--register">register</button>
    </form>

    <button type="button" class="toggle-btn" aria-label="切換到註冊">
      <span class="toggle-btn__shape"> </span>
    </button>

    <form class="panel panel--reset">
      <h2>RESET</h2>
      <div class="field">
        <input type="text" id="reset-username" name="reset-username" required placeholder=" ">
        <label for="reset-username">Username</label>
      </div>

      <div class="field">
        <input type="email" id="reset-email" name="reset-email" required placeholder=" ">
        <label for="reset-email">E-mail</label>
      </div>

      <p class="error-message"></p>
      <button type="submit" class="btn btn--reset">register</button>
    </form>

  </div>

  <script src="/static/js/login2.js" defer></script>

</body>


</html>
