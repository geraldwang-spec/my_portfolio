<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <!-- 1. 補上 Roboto 字體 -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Roboto:400,100,300,500,700,900&font-display=swap">

  <!-- 2. 補上 Font Awesome 圖標庫 -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
  <link href="/static/css/login2.css" rel="stylesheet">
</head>

<body>
  <div class="auth-card" data-view="reset-pw">
    <form class="panel panel--reset-pw">
      <h2>Reset Password</h2>
      <div class="field">
        <input type="password" id="reset-pw-password" name="reset-pw-password" required placeholder=" ">
        <label for="reset-pw-password">Password</label>
      </div>
      <div class="field">
        <input type="password" id="reset-pw-repeat" name="reset-pw-repeat" required placeholder=" ">
        <label for="reset-pw-repeat">Repeat</label>
      </div>
      <p class="error-message"></p>
      <button type="submit" class="btn btn--reset-pw">Reset</button>
    </form>

  </div>

  <script src="/static/js/common.js" defer></script>
  <script src="/static/js/auth/auth-share.js" defer></script>
  <script src="/static/js/auth/reset-passwd.js"></script>

</body>

</html>
